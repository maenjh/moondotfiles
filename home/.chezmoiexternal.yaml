# Downloaded by chezmoi on apply; refreshed weekly with `chezmoi apply --refresh-externals`
# or automatically once refreshPeriod has passed.

".oh-my-zsh":
  type: archive
  url: "https://github.com/ohmyzsh/ohmyzsh/archive/refs/heads/master.tar.gz"
  stripComponents: 1
  refreshPeriod: 168h

